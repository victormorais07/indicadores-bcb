name: Coletar indicadores

on:
  schedule:
    # 23h UTC = 20h em Brasília, de segunda a sexta (o BC não publica no fim de semana)
    - cron: "0 23 * * 1-5"
  workflow_dispatch: # botão pra rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: python -m pytest -q

      - name: Coletar dados
        run: python main.py

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/ imagens/ README.md
          if git diff --cached --quiet; then
            echo "Nada novo hoje."
          else
            git commit -m "dados: atualização de $(date +%d/%m/%Y)"
            git push
          fi
